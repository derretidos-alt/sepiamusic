<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sepiamusic" />
  <meta name="theme-color" content="#0f0f0f" />
  <title>Sepiamusic</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #2a2a2a;
      --accent: #8B5CF6;
      --text: #f5f5f0;
      --muted: #777;
      /* Ancho de la franja visible sobre el play de Spotify, anclada a la derecha */
      --play-strip: 72px;
    }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }

    .screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem; text-align: center;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .screen.hidden { opacity: 0; pointer-events: none; transform: scale(0.97); }

    /* ── SHARED ── */
    .logo {
      font-weight: 700;
      font-size: 3rem;
      letter-spacing: -0.065em;
      line-height: 1;
      color: var(--accent);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 50px;
      padding: 1rem 2.5rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      width: 100%; max-width: 300px;
      transition: opacity 0.15s, transform 0.15s;
    }
    .btn-primary:active { opacity: 0.82; transform: scale(0.97); }
    .btn-secondary {
      background: transparent; color: var(--muted);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50px; padding: 0.85rem 2rem;
      font-family: inherit; font-size: 0.85rem;
      cursor: pointer; width: 100%; max-width: 300px;
      transition: color 0.2s, border-color 0.2s;
    }
    .btn-secondary:active { color: var(--text); border-color: rgba(255,255,255,0.25); }

    /* ── VINYL ── */
    .vinyl {
      width: 130px; height: 130px;
      border-radius: 50%;
      background: conic-gradient(#1a1a1a 0deg,#232323 30deg,#1a1a1a 60deg,#232323 90deg,#1a1a1a 120deg,#232323 150deg,#1a1a1a 180deg,#232323 210deg,#1a1a1a 240deg,#232323 270deg,#1a1a1a 300deg,#232323 330deg,#1a1a1a 360deg);
      border: 3px solid #2a2a2a;
      position: relative;
      animation: spin 8s linear infinite;
    }
    .vinyl::after {
      content: '';
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%,-50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      background: var(--accent);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .vinyl { animation: none; }
      .play-hint-ring { animation: none !important; }
    }

    /* ── HOME ── */
    #home-screen { gap: 2rem; }
    .tagline { font-size: 0.9rem; color: var(--muted); max-width: 230px; line-height: 1.7; }

    /* ── SCANNER ── */
    #scanner-screen { gap: 0; padding: 0; background: #000; }
    #video-wrap {
      position: relative; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #scanner-video { width: 100%; height: 100%; object-fit: cover; }
    #viewfinder {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      pointer-events: none;
    }
    .vf-label-top {
      position: absolute;
      top: max(env(safe-area-inset-top), 1.2rem);
      left: 50%; transform: translateX(-50%);
      font-weight: 700; font-size: 1.2rem; letter-spacing: -0.04em;
      color: #fff; text-shadow: 0 1px 8px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    .vf-frame { width: 220px; height: 220px; position: relative; }
    .vf-frame::before, .vf-frame::after, .vf-corner-bl, .vf-corner-br {
      content: ''; position: absolute;
      width: 36px; height: 36px;
      border-color: var(--accent); border-style: solid;
    }
    .vf-frame::before { top:0; left:0;    border-width: 3px 0 0 3px; border-radius: 4px 0 0 0; }
    .vf-frame::after  { top:0; right:0;   border-width: 3px 3px 0 0; border-radius: 0 4px 0 0; }
    .vf-corner-bl     { bottom:0; left:0;  border-width: 0 0 3px 3px; border-radius: 0 0 0 4px; }
    .vf-corner-br     { bottom:0; right:0; border-width: 0 3px 3px 0; border-radius: 0 0 4px 0; }
    .vf-scan-line {
      position: absolute; left: 4px; right: 4px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      animation: scan 2s ease-in-out infinite;
    }
    @keyframes scan {
      0%   { top: 4px; opacity: 1; }
      90%  { top: calc(100% - 6px); opacity: 1; }
      100% { top: calc(100% - 6px); opacity: 0; }
    }
    .vf-hint {
      position: absolute;
      bottom: max(env(safe-area-inset-bottom), 2rem);
      left: 50%; transform: translateX(-50%);
      font-size: 0.8rem; color: rgba(255,255,255,0.55);
      text-align: center; white-space: nowrap; pointer-events: all;
    }
    .vf-cancel {
      display: block;
      margin: 0.5rem auto 0;
      color: rgba(255,255,255,0.55); font-size: 0.9rem;
      text-decoration: underline; background: none; border: none; cursor: pointer;
      padding: 0.75rem 1.5rem; /* área táctil amplia */
    }
    #scan-flash {
      position: absolute; inset: 0;
      background: rgba(139,92,246,0.4);
      opacity: 0; pointer-events: none; transition: opacity 0.15s;
    }
    #scan-flash.flash { opacity: 1; }

    /* ── PLAYING ── */
    #playing-screen { gap: 1.75rem; }
    .playing-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--accent);
      font-weight: 500;
    }
    .player-wrap {
      position: relative;
      width: 100%; max-width: 340px;
      border-radius: 16px;
      /* borde sutil para que la caja tapada se lea como elemento intencional */
      box-shadow: 0 0 0 1px rgba(255,255,255,0.07);
    }
    .spotify-embed { width: 100%; border-radius: 16px; overflow: hidden; }
    /* Máscara anclada al borde DERECHO: funciona en cualquier ancho de pantalla,
       porque Spotify ancla el botón de play a la derecha del embed */
    .play-mask {
      position: absolute; inset: 0;
      border-radius: 16px;
      overflow: hidden;
      pointer-events: none;
      background: var(--bg);
      -webkit-mask-image: linear-gradient(to left, transparent 0, transparent var(--play-strip), black var(--play-strip));
      mask-image: linear-gradient(to left, transparent 0, transparent var(--play-strip), black var(--play-strip));
    }
    /* Anillo-guía pulsante sobre la zona del play (visual, no bloquea el tap) */
    .play-hint-ring {
      position: absolute;
      right: calc(var(--play-strip) / 2);
      bottom: 44px;
      width: 56px; height: 56px;
      transform: translateX(50%);
      border: 2px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      animation: pulse-ring 1.8s ease-out infinite;
      opacity: 0.85;
    }
    @keyframes pulse-ring {
      0%   { transform: translateX(50%) scale(0.85); opacity: 0.85; }
      70%  { transform: translateX(50%) scale(1.18); opacity: 0; }
      100% { transform: translateX(50%) scale(1.18); opacity: 0; }
    }
    .play-instruction {
      font-size: 0.88rem;
      color: var(--muted);
      max-width: 250px;
      line-height: 1.6;
    }
    .play-instruction strong { color: var(--text); font-weight: 500; }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%);
      background: #2a2a2a; color: var(--text);
      padding: 0.6rem 1.2rem; border-radius: 20px;
      font-size: 0.82rem; white-space: nowrap;
      opacity: 0; transition: opacity 0.3s;
      z-index: 200; pointer-events: none;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ══ HOME ══ -->
<div class="screen" id="home-screen">
  <div class="vinyl"></div>
  <div class="logo">Sepiamusic</div>
  <p class="tagline">Escanea el QR de la carta y colócala en tu línea del tiempo.</p>
  <button class="btn-primary" id="scan-btn">Escanear QR</button>
</div>

<!-- ══ SCANNER ══ -->
<div class="screen hidden" id="scanner-screen">
  <div id="video-wrap">
    <video id="scanner-video" playsinline muted autoplay></video>
    <div id="viewfinder">
      <span class="vf-label-top">Sepiamusic</span>
      <div class="vf-frame">
        <div class="vf-corner-bl"></div>
        <div class="vf-corner-br"></div>
        <div class="vf-scan-line"></div>
      </div>
      <div class="vf-hint">
        Apunta al código QR de la carta
        <button class="vf-cancel" onclick="goHome()">Cancelar</button>
      </div>
    </div>
    <div id="scan-flash"></div>
  </div>
</div>

<!-- ══ PLAYING ══ -->
<div class="screen hidden" id="playing-screen">
  <span class="playing-label">♪ Carta cargada</span>
  <div class="player-wrap">
    <div class="spotify-embed" id="embed-container"></div>
    <div class="play-mask"></div>
    <div class="play-hint-ring"></div>
  </div>
  <p class="play-instruction">Pulsa el <strong>play</strong> del círculo para escuchar la muestra</p>
  <button class="btn-primary" onclick="startScanner()">Escanear siguiente carta</button>
  <button class="btn-secondary" onclick="goHome()">Inicio</button>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
/* ══════════ STATE ══════════ */
var currentTrackId = null;
var videoStream = null;
var scannerActive = false;
var scannerStarting = false;      // guard contra doble tap
var scanCanvas, scanCtx, scanRafId;
var lastInvalidToast = 0;         // throttle de avisos de QR inválido

/* ══════════ UTILS ══════════ */
function showToast(msg, ms) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, ms || 2800);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.add('hidden'); });
  document.getElementById(id).classList.remove('hidden');
}

function goHome() {
  stopAll();
  showScreen('home-screen');
}

function stopAll() {
  stopScanner();
  currentTrackId = null;
  document.getElementById('embed-container').innerHTML = '';
}

/* ══════════ SPOTIFY ══════════ */
function extractSpotifyId(raw) {
  try {
    var u = new URL(raw);
    // Formato 1: https://open.spotify.com/track/ID  (o /intl-xx/track/ID)
    var parts = u.pathname.split('/');
    var idx = parts.indexOf('track');
    if (idx !== -1 && parts[idx + 1]) return parts[idx + 1].split('?')[0];
    // Formato 2: URL de la app con ?id=ID
    var id = u.searchParams.get('id');
    if (id) return id;
  } catch (e) {}
  // Formato 3: URI spotify:track:ID
  var m = raw.match(/spotify[:/]+track[:/]+([A-Za-z0-9]+)/);
  return m ? m[1] : null;
}

function isValidTrackId(id) {
  return /^[A-Za-z0-9]{15,30}$/.test(id);
}

function setupEmbed(trackId) {
  var container = document.getElementById('embed-container');
  container.innerHTML = '<iframe' +
    ' src="https://open.spotify.com/embed/track/' + trackId +
    '?utm_source=generator&theme=0"' +
    ' width="100%" height="152" frameborder="0"' +
    ' allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"' +
    ' style="display:block; border-radius:16px;"></iframe>';
}

/* ══════════ SCANNER ══════════ */
function startScanner() {
  if (scannerStarting || scannerActive) return; // guard doble tap
  scannerStarting = true;

  stopAll();
  showScreen('scanner-screen');

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
  }).then(function(stream) {
    scannerStarting = false;
    videoStream = stream;
    var video = document.getElementById('scanner-video');
    video.srcObject = stream;
    video.play().then(function() {
      if (!scanCanvas) {
        scanCanvas = document.createElement('canvas');
        scanCtx = scanCanvas.getContext('2d', { willReadFrequently: true });
      }
      scannerActive = true;
      scanRafId = requestAnimationFrame(scanFrame);
    });
  }).catch(function() {
    scannerStarting = false;
    showScreen('home-screen');
    showToast('No se pudo acceder a la cámara');
  });
}

function scanFrame() {
  if (!scannerActive) return;
  var video = document.getElementById('scanner-video');
  if (video.readyState < 2 || !video.videoWidth) {
    scanRafId = requestAnimationFrame(scanFrame);
    return;
  }
  var w = video.videoWidth, h = video.videoHeight;
  scanCanvas.width = w; scanCanvas.height = h;
  scanCtx.drawImage(video, 0, 0, w, h);
  var code = jsQR(scanCtx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'dontInvert' });

  if (code && code.data) {
    var trackId = extractSpotifyId(code.data);
    if (trackId && isValidTrackId(trackId)) {
      onValidQR(trackId);
      return; // detiene el bucle — onValidQR gestiona el resto
    }
    // QR leído pero no es de Spotify: avisa (throttled) y SIGUE escaneando
    var now = Date.now();
    if (now - lastInvalidToast > 3000) {
      lastInvalidToast = now;
      showToast('Ese QR no es de Spotify — prueba con otro');
    }
  }
  scanRafId = requestAnimationFrame(scanFrame);
}

function stopScanner() {
  scannerActive = false;
  scannerStarting = false;
  if (scanRafId) { cancelAnimationFrame(scanRafId); scanRafId = null; }
  if (videoStream) {
    videoStream.getTracks().forEach(function(t) { t.stop(); });
    videoStream = null;
  }
}

/* ══════════ QR VÁLIDO ══════════ */
function onValidQR(trackId) {
  scannerActive = false;

  // Flash de confirmación
  var flash = document.getElementById('scan-flash');
  flash.classList.add('flash');
  setTimeout(function() { flash.classList.remove('flash'); }, 280);

  // Apagar cámara tras el flash
  setTimeout(stopScanner, 350);

  currentTrackId = trackId;
  startPlayback();
}

/* ══════════ PLAYBACK ══════════ */
function startPlayback() {
  showScreen('playing-screen');
  setupEmbed(currentTrackId);
}

/* ══════════ URL PARAMS (QR que abre la app directamente) ══════════ */
function checkUrlParams() {
  var p = new URLSearchParams(window.location.search);
  var id = p.get('id');
  if (id && isValidTrackId(id)) {
    currentTrackId = id;
    startPlayback();
  }
}

/* ══════════ INIT ══════════ */
checkUrlParams();
document.getElementById('scan-btn').addEventListener('click', startScanner);
</script>
</body>
</html>
